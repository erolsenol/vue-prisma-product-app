name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:password@localhost:3306/db
      RUN_DB_TESTS: true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: db
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir api exec prisma validate
      - run: pnpm --dir api prisma:deploy
      - run: pnpm --dir api prisma:generate
      - run: pnpm --dir api typecheck
      - run: pnpm --dir api build
      - run: pnpm --dir api test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir vue-app typecheck:strict
      - run: pnpm --dir vue-app lint
      - run: pnpm --dir vue-app build

  docker:
    runs-on: ubuntu-latest
    needs: [api, frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          tags: vue-prisma-product-app/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./vue-app
          file: ./vue-app/Dockerfile
          push: false
          tags: vue-prisma-product-app/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
